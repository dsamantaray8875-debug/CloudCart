apiVersion: batch/v1
kind: Job
metadata:
  name: cloudcart
  labels:
    app: cloudcart
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: cloudcart
    spec:
      restartPolicy: Never
      containers:
        - name: cloudcart
          image: cloudcart:1.0
          imagePullPolicy: IfNotPresent
